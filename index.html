<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="A draggable board featuring all 32 NFL team logos." />
    <title>NFL Futures Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="page-nav" aria-label="Main navigation">
      <a class="nav-link active" href="index.html" aria-current="page">Logo board</a>
      <a class="nav-link" href="divisions.html">Division winners</a>
      <a class="nav-link" href="conferences.html">Conference winners</a>
      <a class="nav-link" href="wins.html">Season wins</a>
      <a class="nav-link" href="summary.html">Summary</a>
    </nav>
    <header class="site-header">
      <div>
        <p class="eyebrow">NFL FUTURES</p>
        <h1>Build your board.</h1>
        <p class="subtitle">Drag every team wherever you think they belong.</p>
      </div>
      <button id="reset-button" class="reset-button" type="button">Reset board</button>
    </header>

    <main>
      <section class="board-shell" aria-labelledby="board-title">
        <div class="board-heading">
          <h2 id="board-title">All 32 teams</h2>
          <p><span class="status-dot"></span> Positions save on this device</p>
        </div>
        <div id="team-board" class="team-board" aria-label="Draggable NFL team tier board">
          <div class="tier-zone tier-s" aria-hidden="true"><span>S</span><small>ELITE</small></div>
          <div class="tier-zone tier-a" aria-hidden="true"><span>A</span><small>CONTENDERS</small></div>
          <div class="tier-zone tier-b" aria-hidden="true"><span>B</span><small>PLAYOFF</small></div>
          <div class="tier-zone tier-c" aria-hidden="true"><span>C</span><small>MIDDLE</small></div>
          <div class="tier-zone tier-d" aria-hidden="true"><span>D</span><small>REBUILD</small></div>
          <div class="unranked-zone" aria-hidden="true"><span>UNRANKED</span><small>Drag teams into a tier</small></div>
        </div>
      </section>
    </main>

    <template id="team-template">
      <button class="team-card" type="button">
        <span class="logo-wrap"><img class="team-logo" alt="" draggable="false" /></span>
        <span class="team-name"></span>
      </button>
    </template>

    <script src="app.js"></script>
  </body>
</html>
